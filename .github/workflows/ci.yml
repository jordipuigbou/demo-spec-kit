name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: qa-conferences/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: qa-conferences

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: qa-conferences

      - name: Run unit and component tests
        run: npm run test:ci
        working-directory: qa-conferences

      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: qa-conferences

      - name: Upload JUnit XML (unit tests)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-unit
          path: qa-conferences/test-results/junit.xml

      - name: Upload HTML report (unit tests)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: html-unit
          path: qa-conferences/test-results/html/

      - name: Upload JUnit XML (E2E)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-e2e
          path: qa-conferences/playwright-report/results.xml

      - name: Upload HTML report (E2E)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: html-e2e
          path: qa-conferences/playwright-report/
